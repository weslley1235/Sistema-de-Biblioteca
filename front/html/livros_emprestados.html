<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Livros emprestados</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <h1>Livros emprestados</h1>

    <div id="listaEmprestimo"></div>

    <script>
      async function carregarEmprestimo() {
        const resposta = await fetch('/emprestimo');
        const emprestimo = await resposta.json();
        const lista = document.getElementById('listaEmprestimo');

        lista.innerHTML = '';

        for (const item of emprestimo) {
          if (item.devolvido) {
            continue;
          }

          const respostaLivro = await fetch(`/livro/${item.livroId}`);
          const livro = await respostaLivro.json();
          const div = document.createElement('div');

          div.innerHTML = `
                    <h3>Nome: ${livro.title}</h3>

                    <p>Ano: ${livro.ano}</p>

                    <p>Data do empréstimo: ${new Date(item.dataEmprestimo).toLocaleDateString('pt-BR', 
                      { timeZone: 'UTC' })}</p>

                    <p>Data da devolução:
                        ${item.dataDevolucao ? new Date(item.dataDevolucao).toLocaleDateString('pt-BR', 
                        { timeZone: 'UTC' }) : 'Ainda não devolvido'}
                    </p>

                    <button onclick="devolverLivro('${item.id}')">
                         Devolver livro
                     </button>

                    <hr>
                `;

          lista.appendChild(div);
        }
      }

      carregarEmprestimo();

      async function devolverLivro(id) {
        const resposta = await fetch(`/emprestimo/${id}`, {
          method: 'PUT',
        });

        const resultado = await resposta.json();
        alert(resultado.mensagem);

        if (resposta.ok) {
          carregarEmprestimo();
        }
      }
    </script>

    <button onclick="window.location.href = '/index'">Voltar</button>
    <button onclick="window.location.href = '/logout'">Sair</button>
  </body>
</html>
