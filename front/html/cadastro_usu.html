<!doctype html>

<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Biblioteca</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <div class="pagina-acesso">
      <div class="cartao-acesso">
        <div class="marca">
          <h2>Biblioteca</h2>
          <p>Sistema de gerenciamento</p>
        </div>

        <div class="abas-acesso">
          <button type="button" id="abaLogin" class="aba ativa">Login</button>
          <button type="button" id="abaCadastro" class="aba">
            Cadastrar usuário
          </button>
        </div>

        <div id="painelLogin" class="painel-acesso">
          <h1>Bem-vindo de volta</h1>

          <form id="formLogin">
            <label>Tipo de usuário:</label>
            <select id="tipoLogin" required>
              <option value="">Selecione</option>
              <option value="Aluno">Aluno</option>
              <option value="Professor">Professor</option>
              <option value="administracao">Administração</option>
            </select>

            <div id="campoCpfLogin" hidden>
              <label>CPF:</label>
              <input type="text" id="cpfLogin" maxlength="11" />
            </div>

            <div id="campoMatriculaLogin" hidden>
              <label>Matrícula:</label>
              <input type="text" id="matriculaLogin" maxlength="15" />
            </div>

            <label>E-mail:</label>
            <input type="email" id="emailLogin" required />

            <label>Senha:</label>
            <input type="password" id="senhaLogin" required />

            <button type="submit">Entrar</button>
          </form>

          <p id="mensagemLogin"></p>
        </div>

        <div id="painelCadastro" class="painel-acesso" hidden>
          <h1>Criar conta</h1>

          <form id="formulario">
            <label>Nome:</label>
            <input type="text" id="nome" required />

            <label>E-mail:</label>
            <input type="email" id="email" required />

            <label>Senha:</label>
            <input type="password" id="senha" required />

            <label>CPF:</label>
            <input type="text" id="cpf" maxlength="11" required />

            <label>Telefone:</label>
            <input type="text" id="tel" maxlength="11" required />

            <label>Tipo de usuário:</label>
            <select id="tipoUsu" required>
              <option value="">Selecione</option>
              <option value="administracao">Administração</option>
              <option value="Professor">Professor</option>
              <option value="Aluno">Aluno</option>
            </select>

            <label>Matrícula (somente Administração)</label>
            <input type="text" id="matricula" maxlength="15" />

            <label>CEP:</label>
            <input type="text" id="cep" maxlength="8" required />

            <label>Estado:</label>
            <input type="text" id="state" maxlength="2" required />

            <label>Cidade:</label>
            <input type="text" id="city" required />

            <label>Rua:</label>
            <input type="text" id="street" required />

            <button type="submit">Cadastrar usuário</button>
          </form>

          <p id="mensagem"></p>
        </div>
      </div>
    </div>

    <script src="/js/login.js"></script>
    <script src="/js/cadastro_usu.js"></script>
  </body>
</html>
