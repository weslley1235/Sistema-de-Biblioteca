<!doctype html>

<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>

 <body>
  <div class="cartao">
    <div class="cartao-conteudo">
      <div class="cartao-frente">
        <h1>Entrar no sistema</h1>

        <form id="formLogin">
          <label>E-mail:</label>
          <input type="email" id="emailLogin" required />

          <label>Senha:</label>
          <input type="password" id="senhaLogin" required />

          <label>Matrícula (somente administração):</label>
          <input type="text" id="matriculaLogin" maxlength="15" />

          <button type="submit">Entrar</button>
        </form>

        <p id="mensagemLogin"></p>
      </div>
    </div>
  </div>

  
  <script src="/js/login.js"></script>
</body>
</html>
