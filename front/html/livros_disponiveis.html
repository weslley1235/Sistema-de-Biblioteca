<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Livros disponíveis</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <h1>Livros disponíveis</h1>

    <div id="listaLivros"></div>

    <script>
      const carregarLivros = async () => {
        const respostaLivros = await fetch('/livro');
        const livros = await respostaLivros.json();

        const respostaEmprestimo = await fetch('/emprestimo');
        let emprestimos = await respostaEmprestimo.json();

        const lista = document.getElementById('listaLivros');

        if (!Array.isArray(emprestimos)) {
          emprestimos = [];
        }

        lista.innerHTML = '';

        livros.forEach((livro) => {
          const livroEmprestado = emprestimos.find((item) => {
            return item.livroId === livro.id && item.devolvido === false;
          });

          if (!livroEmprestado) {
            const div = document.createElement('div');

            div.innerHTML = `
              <h3>Nome: ${livro.title}</h3>

              <p>Autor: ${livro.autor}</p>

              <p>Ano: ${livro.ano}</p>

              <button onclick="window.location.href='/novo-emprestimo?livroId=${livro.id}'">
                Emprestar
              </button>

              <button onclick="excluirLivro('${livro.id}')">
                Excluir livro
              </button>

              <hr>
            `;

            lista.appendChild(div);
          }
        });
      };

      const excluirLivro = async (id) => {
        const confirmar = confirm('Deseja realmente excluir este livro?');

        if (!confirmar) return;

        const resposta = await fetch(`/livro/${id}`, {
          method: 'DELETE',
        });

        const resultado = await resposta.json();

        alert(resultado.mensagem || resultado.message);

        if (resposta.ok) {
          carregarLivros();
        }
      };

      carregarLivros();
    </script>

    <button onclick="window.location.href = '/index'">Voltar</button>
    <button onclick="window.location.href = '/logout'">Sair</button>
  </body>
</html>
