<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Biblioteca</title>

    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <header class="cabecalho">
      <nav class="menu">
        <div class="menu-item">
          <button type="button" class="menu-botao">Livros ▾</button>

          <div class="submenu">
            <a href="/livros-disponiveis">Livros disponíveis</a>
            <a href="/livros-emprestados">Livros Emprestados</a>
            <a href="/livros-inativos">Livros Inativos</a>
          </div>
        </div>

        <div class="menu-item">
          <button type="button" class="menu-botao">Usuários ▾</button>

          <div class="submenu">
            <a href="/usuarios">Usuários cadastrados</a>
          </div>
        </div>

        <div class="menu-item">
          <a class="menu-botao sair" href="/logout">Sair</a>
        </div>
      </nav>

      <div class="usuario-logado">
        <p>Bem-vindo(a), <strong id="nomeUsuario">Usuário</strong></p>

        <span class="status-usuario">● Online</span>
      </div>
    </header>

    <main>
      <section class="cadastro">
        <h2>Cadastrar Livro</h2>

        <form id="formLivro">
          <input
            type="text"
            id="title"
            placeholder="Título do livro"
            required
          />

          <input type="text" id="autor" placeholder="Autor" required />

          <input type="number" id="ano" placeholder="Ano" required />

          <button type="submit">Cadastrar Livro</button>
        </form>

        <p id="mensagem"></p>
      </section>

      <section class="livros">
        <h2>Livros cadastrados</h2>

        <div id="listaLivros"></div>
      </section>
    </main>

    <script src="/js/script.js"></script>
  </body>
</html>
