<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novo empréstimo</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <h1>Novo empréstimo</h1>

    <div id="dadosLivro"></div>

    <h2>Dados do usuário</h2>

    <label>
      Nome:
      <input type="text" id="nome" />
    </label>

    <br /><br />

    <label>
      Telefone:
      <input type="text" id="tel" />
    </label>

    <br /><br />

    <label>
      CPF:
      <input type="text" id="cpf" />
    </label>

    <br /><br />

    <label>
      Data e hora do empréstimo:
      <input type="datetime-local" id="dataEmprestimo" />
    </label>

    <br /><br />

    <label>
      Data e hora de devolução:
      <input type="datetime-local" id="dataDevolucao" />
    </label>

    <br /><br />

    <button type="button" onclick="fazerEmprestimo()">
      Confirmar empréstimo
    </button>

    <button onclick="window.location.href = '/livros-disponiveis'">
      Voltar
    </button>

    <p id="mensagem"></p>

    <script>
      const parametros = new URLSearchParams(window.location.search);
      const livroId = parametros.get('livroId');

      async function carregarLivro() {
        const resposta = await fetch(`/livro/${livroId}`);
        const livro = await resposta.json();

        const dadosLivro = document.getElementById('dadosLivro');

        dadosLivro.innerHTML = `
          <h2>Livro escolhido</h2>
          <p>Nome: ${livro.title}</p>
          <p>Autor: ${livro.autor}</p>
          <p>Ano: ${livro.ano}</p>
        `;
      }

      async function fazerEmprestimo() {
        const nome = document.getElementById('nome').value;
        const tel = document.getElementById('tel').value;
        const cpf = document.getElementById('cpf').value;

        const dataEmprestimo = document.getElementById('dataEmprestimo').value;

        const dataDevolucao = document.getElementById('dataDevolucao').value;

        if (!dataEmprestimo || !dataDevolucao) {
          alert('Informe a data e a hora do empréstimo e da devolução.');
          return;
        }

        const resposta = await fetch('/emprestimo', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            livroId,
            nome,
            tel,
            cpf,
            dataEmprestimo,
            dataDevolucao,
          }),
        });

        const resultado = await resposta.json();

        if (resposta.ok) {
          alert(
            `${resultado.mensagem}\nData do empréstimo: ${resultado.dataEmprestimo}`,
          );

          window.location.href = '/livros-emprestados';
        } else {
          alert(resultado.mensagem || 'Erro ao realizar empréstimo');
        }
      }

      carregarLivro();
    </script>

    <button onclick="window.location.href = '/logout'">Sair</button>
  </body>
</html>
