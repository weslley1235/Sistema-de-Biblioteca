<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <title>Login</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <h1>Login</h1>

        <form id="formulario">
            <label>E-mail:</label>
            <input type="email" id="email" required />

            <br /><br />

            <label>Senha:</label>
            <input type="password" id="senha" required />

            <br /><br />

            <button type="submit">Entrar</button>
            <button onclick="window.location.href = '/cadastro_usu.html'">Voltar</button>

        </form>

        <p id="mensagem"></p>

        <script src="login.js"></script>
    </body>
</html>
